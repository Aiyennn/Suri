name: mobile
description: "Medical Triage - AI Health Assessment"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  percent_indicator: ^4.2.3
  gap: ^3.0.1
  flutter_secure_storage: ^9.2.2
  # Map & location (OpenStreetMap — no Google Maps API key required)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
